<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="../02-css/00-root.css">
    <link rel="stylesheet" href="../02-css/03-carrito.css">

</head>

<body>

    <section class="fondo">

        <div class="modal">

            <div class="top">
                <h1>Carrito</h1>
                <button>X</button>
            </div>

            <div class="producto">
                <img src="../assets/producto1.jpg" alt="Producto">
                <div>
                    <h2>Oversize Black</h2>
                    <p>$120.000</p>
                </div>
            </div>

            <div class="producto">
                <img src="../assets/producto2.jpg" alt="Producto">
                <div>
                    <h2>Leggings Motion</h2>
                    <p>$180.000</p>
                </div>
            </div>

            <div class="total">

                <h2>Total:</h2>
                <p>$300.000</p>

            </div>

            <button class="comprar">
                Comprar
            </button>
        </div>

    </section>

</body>
</html>
