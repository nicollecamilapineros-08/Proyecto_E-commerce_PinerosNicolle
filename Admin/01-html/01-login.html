<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gymshark Login</title>

    <link rel="stylesheet" href="../02-css/00-root.css">
    <link rel="stylesheet" href="../02-css/01-login.css">

</head>

<body>

    <section class="login-container">

        <div class="login-box">

            <img src="../img/logoGymshark.png" alt="Logo">
            <h1>GYMSHARK</h1>
            <p>Panel administrativo</p>

            <form>

                <div class="input-datos">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="admin@gymshark.com" id="email">
                </div>

                <div class="input-datos">
                    <label>Contraseña</label>
                    <input type="password" placeholder="********" id="pass">

                </div>

                <button type="button" id="btnIngresar">
                    Ingresar
                </button>

            </form>

        </div>

    </section>
    <script src="../03-js/01-login.js"></script>

</body>
</html>
