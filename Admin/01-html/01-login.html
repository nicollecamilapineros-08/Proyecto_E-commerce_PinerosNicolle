<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="../02-css/00-root.css">
    <link rel="stylesheet" href="../02-css/01-login.css">
</head>
<body>
    
    <div id="page-login" class="page active">
  <div class="login-box">
    <div class="login-brand">
      <img src="LOGO.png" alt="Gymshark Logo" />
      <h1>Gymshark</h1>
      <p>Panel de Administración</p>
    </div>

    <div class="field">
      <label for="login-email">Correo electrónico</label>
      <input id="login-email" type="email" placeholder="admin@gymshark.com" />
    </div>

    <div class="field">
      <label for="login-pass">Contraseña</label>
      <input id="login-pass" type="password" placeholder="••••••••" />
    </div>
    <a href="../01-html/02-dashboard.html"><button class="btn btn-primary" id="btn-login" style="width:100%">Ingresar</button></a>
    
  </div>
</div>
</body>
</html>
